[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "A small HTTP MCP gateway for dispatching Trae and Antigravity CLI tasks."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9.0,<2",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agent-gateway = "agent_gateway.server:main"

[tool.setuptools.packages.find]
include = ["agent_gateway*"]
